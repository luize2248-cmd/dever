<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <title>Operação - Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #38bdf8, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);

            padding: 20px;
        }

        .container {
            width: 440px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.7s ease;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 35px;

            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        label {
            display: block;
            color: #e0f2fe;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 22px;

            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;

            border: 2px solid transparent;
            border-radius: 10px;

            font-size: 16px;

            transition: 0.25s ease;
        }

        input:hover,
        select:hover {
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: none;

            border-color: #38bdf8;

            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.2);
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #38bdf8,
                #2563eb
            );

            color: white;

            font-size: 17px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.4);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.55);
        }

        button:active {
            transform: translateY(0);
        }

        .voltar {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #bae6fd;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: 0.2s ease;
        }

        .voltar:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 500px) {
            .container {
                width: 100%;
                padding: 30px 25px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Realizar Operação</h1>

        <form method="POST" onsubmit="return confirmarOperacao()">

            <label for="numero1">
                Primeiro número
            </label>

            <input
                type="number"
                id="numero1"
                name="numero1"
                step="any"
                placeholder="Digite o primeiro número"
                required
            >

            <label for="operador">
                Operação
            </label>

            <select
                id="operador"
                name="operador"
                required
            >
                <option value="+">Somar (+)</option>
                <option value="-">Subtrair (-)</option>
                <option value="*">Multiplicar (×)</option>
                <option value="/">Dividir (÷)</option>
            </select>

            <label for="numero2">
                Segundo número
            </label>

            <input
                type="number"
                id="numero2"
                name="numero2"
                step="any"
                placeholder="Digite o segundo número"
                required
            >

            <button type="submit">
                Ver resultado
            </button>

        </form>

        <a href="/" class="voltar">
            ← Voltar para Home
        </a>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
