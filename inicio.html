<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon"
        href="{{ url_for('static', filename='favicon.ico') }}?v=2">

    <title>Início - Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #38bdf8, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);

            color: #fff;
        }

        .container {
            width: 420px;
            padding: 50px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.7s ease;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;

            color: #ffffff;

            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        p {
            color: #dbeafe;
            font-size: 17px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 14px 30px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;

            font-size: 17px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.55);
        }

        button:active {
            transform: translateY(0);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora</h1>

        <p>
            Bem-vindo à nossa calculadora!
        </p>

        <a href="/operacao">
            <button>Iniciar</button>
        </a>

    </div>

</body>

</html>
